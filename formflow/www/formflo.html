{% extends "templates/web.html" %}
{% block page_content %}

<div id="app" class="form-wrapper">

    <h2 class="text-center">[[ formTitle ]]</h2>

    <div v-if="error" class="alert alert-danger">
        [[ error ]]
    </div>

    <div v-if="success" class="alert alert-success">
        [[ success ]]
    </div>

    <div v-for="field in visibleFields"
         :key="field.fieldname"
         class="mb-3">

        <label class="form-label">
            [[ field.label_override || formatLabel(field.fieldname) ]]
            <span v-if="field.required" style="color:red">*</span>
        </label>

        <input
            type="text"
            class="form-control"
            v-model="formData[field.fieldname]"
            :readonly="field.read_only"
        >
    </div>

</div>

<style>
.form-wrapper {
    max-width: 500px;
    margin: 70px auto;
    padding: 30px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
}
</style>

<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const { createApp } = Vue;

    createApp({
        delimiters: ['[[', ']]'],
        data() {
            return {
                formTitle: "Loading Form...",
                error: "",
                success: "",
                fields: [],
                formData: {},
                formName: "",
                uniqueId: ""
            }
        },
        computed: {
            visibleFields() {
                return this.fields.filter(f => !f.hidden);
            }
        },
        mounted() {
            const params = new URLSearchParams(window.location.search);
            this.formName = params.get("form_name");
            this.uniqueId = params.get("id");

            if (!this.formName) {
                this.error = "Form name missing.";
                return;
            }

            this.loadForm();
        },
        methods: {
            async loadForm() {
                const response = await fetch(
                    `/api/method/formflow.formflow.api.get_form_config?form_name=${this.formName}`
                );
                const result = await response.json();

                if (!response.ok) {
                    this.error = result.message || "Failed to load form.";
                    return;
                }

                this.formTitle = result.message.form_name;
                this.fields = result.message.form_fields || [];

                this.fields.forEach(field => {
                    this.formData[field.fieldname] = "";
                });
            },
            formatLabel(name) {
                return name.replace(/_/g, " ").toUpperCase();
            }
        }
    }).mount("#app");

});
</script>

{% endblock %}

{% extends "templates/web.html" %}
{% block page_content %}

<script src="https://cdn.tailwindcss.com"></script>

<div id="app" class="min-h-screen bg-gray-50 flex items-center justify-center px-4 py-12">

    <div class="w-full max-w-2xl bg-white rounded-2xl shadow-xl p-8">

        <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">
            [[ formTitle ]]
        </h2>

        <div v-if="error" class="mb-4 p-3 rounded-lg bg-red-100 text-red-700 text-sm">
            [[ error ]]
        </div>

        <div v-if="success" class="mb-4 p-3 rounded-lg bg-green-100 text-green-700 text-sm">
            [[ success ]]
        </div>

        <div v-for="field in visibleFields" :key="field.fieldname" class="mb-5">

            <label class="block text-sm font-medium text-gray-700 mb-1">
                [[ field.label ]]
                <span v-if="field.required" class="text-red-500">*</span>
            </label>

            <!-- Text Inputs -->
            <input v-if="inputTypes.includes(field.fieldtype)"
                   type="text"
                   class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-black focus:outline-none"
                   v-model="formData[field.fieldname]"
                   :readonly="field.read_only">

            <!-- Date -->
            <input v-else-if="field.fieldtype === 'Date'"
                   type="date"
                   class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-black focus:outline-none"
                   v-model="formData[field.fieldname]"
                   :readonly="field.read_only">

            <!-- Checkbox -->
            <div v-else-if="field.fieldtype === 'Check'" class="flex items-center space-x-2">
                <input type="checkbox"
                       class="h-4 w-4 text-black border-gray-300 rounded"
                       v-model="formData[field.fieldname]"
                       true-value="1"
                       false-value="0"
                       :disabled="field.read_only">
                <span class="text-sm text-gray-600">Yes</span>
            </div>

            <!-- Attach -->
            <div v-else-if="field.fieldtype === 'Attach'">

                <input type="file"
                       class="hidden"
                       :id="field.fieldname"
                       :disabled="field.read_only"
                       @change="handleFileUpload($event, field.fieldname)">

                <label :for="field.fieldname"
                       class="inline-block w-full text-center px-4 py-2 bg-black text-white rounded-lg cursor-pointer hover:bg-gray-800 transition"
                       :class="{ 'opacity-50 cursor-not-allowed': field.read_only }">
                    Choose File
                </label>

                <!-- Uploaded File Preview -->
                <div v-if="formData[field.fieldname]"
                     class="mt-3 p-3 border rounded-lg bg-gray-50">

                    <!-- Image Preview -->
                    <div v-if="isImage(formData[field.fieldname])" class="mb-3">
                        <img :src="formData[field.fieldname]"
                             class="max-h-40 rounded-md border shadow-sm">
                    </div>

                    <!-- File Info -->
                    <div class="flex items-center justify-between text-sm">

                        <a :href="formData[field.fieldname]"
                           target="_blank"
                           class="text-blue-600 underline break-all">
                            [[ getFileName(formData[field.fieldname]) ]]
                        </a>

                        <button type="button"
                                class="text-red-500 hover:text-red-700 ml-3"
                                @click="formData[field.fieldname] = ''">
                            Remove
                        </button>

                    </div>

                </div>

            </div>

            <!-- Table -->
            <div v-else-if="field.fieldtype === 'Table'" class="border rounded-lg p-4 bg-gray-50">

                <div v-for="(row, index) in formData[field.fieldname]"
                     :key="index"
                     class="mb-4 border-b pb-4">

                    <div v-for="child in field.child_fields"
                         :key="child.fieldname"
                         class="mb-2">

                        <label class="block text-xs font-medium text-gray-600 mb-1">
                            [[ child.label ]]
                        </label>

                        <input type="text"
                               class="w-full px-2 py-1 border rounded-md focus:ring-1 focus:ring-black focus:outline-none text-sm"
                               v-model="row[child.fieldname]"
                               :readonly="field.read_only">
                    </div>

                    <button type="button"
                            class="mt-2 text-xs px-3 py-1 bg-red-500 text-white rounded hover:bg-red-600 transition"
                            @click="removeChildRow(field.fieldname, index)"
                            :disabled="field.read_only">
                        Remove
                    </button>

                </div>

                <button type="button"
                        class="text-xs px-4 py-2 bg-gray-800 text-white rounded hover:bg-black transition"
                        @click="addChildRow(field)"
                        :disabled="field.read_only">
                    Add Row
                </button>

            </div>

        </div>

        <button type="button"
                class="w-full mt-6 py-3 bg-black text-white font-semibold rounded-lg hover:bg-gray-900 transition"
                @click="submitForm">
            Submit Form
        </button>

    </div>

</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {

const { createApp } = Vue;

createApp({
    delimiters: ['[[', ']]'],

    data() {
        return {
            formTitle: "Loading Form...",
            fields: [],
            formData: {},
            error: "",
            success: "",
            formName: "",
            uniqueId: "",
            inputTypes: [
                "Data","Small Text","Phone","Link","Email",
                "Int","Float","Currency","Percent"
            ]
        }
    },

    computed: {
        visibleFields() {
            return this.fields.filter(f => !f.hidden);
        }
    },

    async mounted() {
        const params = new URLSearchParams(window.location.search);
        this.formName = params.get("form_name");
        this.uniqueId = params.get("id");

        await this.loadForm();

        if (this.uniqueId) {
            await this.prefillData();
        }
    },

    methods: {

        async loadForm() {
            try {
                const response = await fetch(
                    `/api/method/formflow.formflow.api.get_form_config?form_name=${this.formName}`
                );
                const result = await response.json();

                if (!response.ok) {
                    this.handleError(result);
                    return;
                }

                this.formTitle = result.message.form_name;
                this.fields = result.message.form_fields;

                this.fields.forEach(field => {
                    if (field.fieldtype === "Table") {
                        this.formData[field.fieldname] = [];
                    } else if (field.fieldtype === "Check") {
                        this.formData[field.fieldname] = 0;
                    } else {
                        this.formData[field.fieldname] = "";
                    }
                });

            } catch (err) {
                this.error = "Unable to load form";
            }
        },

        async prefillData() {
            try {
                const response = await fetch(
                    `/api/method/formflow.formflow.api.get_doc_by_unique_id?form_name=${this.formName}&unique_id=${this.uniqueId}`
                );
                const result = await response.json();

                if (!response.ok) {
                    this.handleError(result);
                    return;
                }

                Object.keys(result.message).forEach(key => {
                    this.formData[key] = result.message[key];
                });

            } catch (err) {
                this.error = "Failed to fetch document";
            }
        },

        async submitForm() {

            this.error = "";
            this.success = "";

            try {
                const response = await fetch(
                    `/api/method/formflow.formflow.api.submit_form`,
                    {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            form_name: this.formName,
                            data: this.formData,
                            unique_id: this.uniqueId
                        }),
                        credentials: "same-origin"
                    }
                );

                const result = await response.json();

                if (!response.ok) {
                    this.handleError(result);
                    return;
                }

                this.success =
                    "Submission successful! Reference ID: " +
                    result.message.unique_id;

            } catch (err) {
                this.error = "Operation failed";
            }
        },

        async handleFileUpload(event, fieldname) {

            const file = event.target.files[0];
            if (!file) return;

            const fd = new FormData();
            fd.append("file", file);

            try {
                const response = await fetch(
                    "/api/method/formflow.formflow.api.upload_public_file",
                    {
                        method: "POST",
                        body: fd,
                        credentials: "same-origin"
                    }
                );

                const result = await response.json();

                if (!response.ok) {
                    this.error = "File upload failed";
                    return;
                }

                if (result.message && result.message.file_url) {
                    this.formData[fieldname] = result.message.file_url;
                }

            } catch (err) {
                this.error = "File upload failed";
            }
        },

        isImage(url) {
            return /\.(jpg|jpeg|png|gif|webp)$/i.test(url);
        },

        getFileName(url) {
            return url.split('/').pop();
        },

        addChildRow(field) {
            if (field.read_only) return;
            const row = {};
            field.child_fields.forEach(child => {
                row[child.fieldname] = "";
            });
            this.formData[field.fieldname].push(row);
        },

        removeChildRow(fieldname, index) {
            this.formData[fieldname].splice(index, 1);
        },

        handleError(result) {
            if (result._server_messages) {
                const serverMessages = JSON.parse(result._server_messages);
                const messageObj = JSON.parse(serverMessages[0]);
                this.error = messageObj.message;
            } else {
                this.error = "Operation failed";
            }
        }

    }

}).mount("#app");

});
</script>

{% endblock %}
